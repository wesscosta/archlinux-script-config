# makepkg do usuário (lido também pelo yay). Sobrescreve só o necessário de /etc/makepkg.conf.
# !debug: não gerar pacotes *-debug ao compilar do AUR (incidente de 18/10/2026).
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto)

# Compila usando todos os núcleos.
MAKEFLAGS="-j$(nproc)"
